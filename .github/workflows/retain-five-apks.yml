name: Retain five APK versions

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retain:
    runs-on: ubuntu-latest
    steps:
      - name: Remove APK assets older than the five newest releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          repository = os.environ['GH_REPOSITORY']
          token = os.environ['GH_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def api(method, path):
              request = Request(f'https://api.github.com{path}', headers=headers, method=method)
              with urlopen(request, timeout=30) as response:
                  if method == 'DELETE':
                      return None
                  return json.load(response)

          releases = []
          page = 1
          while True:
              batch = api('GET', f'/repos/{repository}/releases?per_page=100&page={page}')
              releases.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          versions = []
          for release in releases:
              if release['draft']:
                  continue
              apks = [asset for asset in release['assets'] if asset['name'].lower().endswith('.apk')]
              if apks:
                  versions.append((release, apks))
          versions.sort(key=lambda pair: pair[0]['published_at'] or pair[0]['created_at'], reverse=True)

          for release, apks in versions[5:]:
              for asset in apks:
                  print(f"Removing old APK {asset['name']} from {release['tag_name']}")
                  api('DELETE', f"/repos/{repository}/releases/assets/{asset['id']}")
          print(f'Keeping {min(len(versions), 5)} APK release versions.')
          PY
